# (ทางเลือกสำหรับคนที่มี Node.js — ถ้าไม่มี ใช้ปุ่ม "อัปเดตโค้ดจาก GitHub" ในหน้าตั้งค่าของเว็บแทน)
# ส่งโค้ดใน src/ ไปยังโปรเจกต์ Apps Script อัตโนมัติ ทุกครั้งที่มีการ push เข้า main
# (ส่งโค้ดอย่างเดียว ยังไม่ Deploy — กด Deploy → New version เองในหน้า Apps Script)
#
# ต้องตั้ง GitHub secrets 2 ตัว (Settings → Secrets and variables → Actions):
#   APPS_SCRIPT_ID  = Script ID ของโปรเจกต์ (Apps Script → Project Settings → IDs)
#   CLASPRC_JSON    = เนื้อหาไฟล์ ~/.clasprc.json หลังรัน `npx @google/clasp@2.4.2 login` บนเครื่องตัวเอง
# ดูขั้นตอนเต็มใน README หัวข้อ "อัปเดตโค้ดอัตโนมัติ"

name: Push to Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', 'apps-script-files.json']
  workflow_dispatch:

concurrency:
  group: apps-script-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check apps-script-files.json matches src/
        run: |
          expected=$(ls src | grep -E '\.(gs|html)$|^appsscript\.json$' | sort)
          listed=$(python3 -c "import json;print('\n'.join(sorted(json.load(open('apps-script-files.json'))['files'])))")
          if [ "$expected" != "$listed" ]; then
            echo "::error::apps-script-files.json ไม่ตรงกับไฟล์ใน src/ — ปุ่มอัปเดตโค้ดในเว็บจะดึงไฟล์ไม่ครบ"
            diff <(echo "$expected") <(echo "$listed") || true
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare clasp config
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$APPS_SCRIPT_ID" ]; then
            echo "::notice::ไม่ได้ตั้ง secret สำหรับ clasp — ข้ามขั้นนี้ (ใช้ปุ่ม อัปเดตโค้ดจาก GitHub ในเว็บแทนได้)"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Push code to Apps Script
        if: env.SKIP != '1'
        run: npx --yes @google/clasp@2.4.2 push --force

      - name: Summary
        if: success() && env.SKIP != '1'
        run: |
          echo "### ✅ ส่งโค้ดเข้า Apps Script แล้ว" >> "$GITHUB_STEP_SUMMARY"
          echo "ขั้นต่อไป: Apps Script → การทำให้ใช้งานได้ → จัดการการทำให้ใช้งานได้ → ✏️ → เวอร์ชันใหม่ → ทำให้ใช้งานได้" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
