<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --text: #1f2430; --muted: #6b7280; --line: #e5e7eb;
  --primary: #2563eb; --primary-weak: #e8efff; --income: #059669; --expense: #dc2626;
  --saving: #7c3aed; --warn: #d97706; --ok: #059669; --bad: #dc2626; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --panel: #1b2029; --text: #e6e8ec; --muted: #9aa3b2; --line: #2b3240;
    --primary: #6b9cff; --primary-weak: #1f2b45; --income: #34d399; --expense: #f87171;
    --saving: #a78bfa; --warn: #fbbf24; --ok: #34d399; --bad: #f87171;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
a { color: var(--primary); }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 600; font-size: 16px; padding: 4px 10px 16px; }
#nav a { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; cursor: pointer; margin-bottom: 2px; }
#nav a:hover { background: var(--bg); }
#nav a.active { background: var(--primary-weak); color: var(--primary); font-weight: 600; }
main { flex: 1; padding: 24px 28px 60px; min-width: 0; }
.loading { color: var(--muted); padding: 40px; text-align: center; }

.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 22px; margin: 0; font-weight: 600; flex: 1; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.grid { display: grid; gap: 16px; }
.cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
.two { grid-template-columns: 1fr 1fr; }
.three { grid-template-columns: 2fr 1fr; }
@media (max-width: 1000px) { .two, .three { grid-template-columns: 1fr; } }

.card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.card { padding: 14px 16px; }
.card .label { color: var(--muted); font-size: 13px; }
.card .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.panel { padding: 16px; min-width: 0; }
.panel h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h2 .spacer { flex: 1; }
.income { color: var(--income); } .expense { color: var(--expense); } .saving { color: var(--saving); }
.muted { color: var(--muted); } .small { font-size: 12px; }

.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 16px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--bg); color: var(--text); }

input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-weak); border-color: var(--primary); }
input[type=checkbox] { width: 16px; height: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 14px; cursor: pointer; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--primary); color: #fff; }

table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.data th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--panel); position: sticky; top: 0; z-index: 1; }
table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
table.data tr:hover td { background: var(--bg); }
table.data tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.table-wrap { overflow: auto; max-height: 70vh; }
.empty { color: var(--muted); text-align: center; padding: 24px; }

.bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--primary); border-radius: 99px; }
.bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); } .bar.ok > div { background: var(--ok); }
.budget-row { margin-bottom: 12px; }
.budget-row .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.badge.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.info { background: var(--primary-weak); color: var(--primary); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs a { padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; }
.tabs a.active { border-color: var(--primary); color: var(--primary); font-weight: 600; }

.cell-high { color: var(--bad); font-weight: 600; } .cell-low { color: var(--warn); font-weight: 600; }
.chart-box { position: relative; height: 280px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 50; overflow: auto; }
.modal.hidden, .toast.hidden, .hidden { display: none; }
.modal-box { background: var(--panel); border-radius: var(--radius); width: min(640px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-box.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; flex: 1; font-size: 16px; }
#modal-body { padding: 16px 18px; max-height: 70vh; overflow: auto; }
.modal-foot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
.error { color: var(--bad); flex: 1; font-size: 13px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 60; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.toast.err { background: #b91c1c; }

.lines-table td { padding: 4px; } .lines-table input, .lines-table select { width: 100%; }
.grid-editor input, .grid-editor select { width: 100%; padding: 5px 7px; }
.grid-editor td { padding: 3px 4px; }

@media (max-width: 720px) {
  .sidebar { width: 60px; padding: 10px 6px; } .sidebar span { display: none; } .brand { padding: 4px 8px 12px; }
  main { padding: 16px; } .form-grid { grid-template-columns: 1fr; }
}
</style>
