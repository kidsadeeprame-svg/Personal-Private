<script>
/* =========================================================
 * แอปการเงินและสุขภาพ — ฝั่งหน้าเว็บ
 * ========================================================= */
const S = { boot: null, page: 'dashboard', charts: {}, token: 0, txCache: {}, txTab: 'list', txFilter: {} };
const INCOME = 'รายรับ', EXPENSE = 'รายจ่าย';
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

/* ---------- ตัวช่วยทั่วไป ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n, d) {
  const v = Number(n) || 0;
  return v.toLocaleString('th-TH', { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 2 : d });
}
const money = n => '฿' + fmt(n);
const num = v => { const n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const cleanNote = s => String(s || '').replace(/\s*\[import\]/g, '').trim();
const isBlank = v => v === '' || v === null || v === undefined;
const truthy = v => v === true || String(v).toUpperCase() === 'TRUE';
function monthLabel(m) { if (!m) return ''; return TH_MONTHS[+m.slice(5, 7) - 1] + ' ' + (+m.slice(0, 4) + 543 - 2500); }
function dateLabel(d) { if (!d) return ''; return +d.slice(8, 10) + ' ' + TH_MONTHS[+d.slice(5, 7) - 1] + ' ' + (+d.slice(0, 4) + 543 - 2500); }
const today = () => S.boot.today;
const thisMonth = () => S.boot.cycleMonth || S.boot.today.slice(0, 7);
/** ช่วงวันที่ของรอบเดือน เช่น "27 พ.ย. – 26 ธ.ค." (ว่างถ้าใช้เดือนปฏิทิน) */
function cycleRangeLabel(m) {
  const s = S.boot && S.boot.cycleStart;
  if (!m || !s || s <= 1) return '';
  const y = +m.slice(0, 4), mo = +m.slice(5, 7);
  const prev = new Date(y, mo - 2, 1);
  return s + ' ' + TH_MONTHS[prev.getMonth()] + ' – ' + (s - 1) + ' ' + TH_MONTHS[mo - 1];
}
const addMonthStr = (m, d) => { const x = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + d, 1); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2); };
const thisMonthLocal = () => { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); };
const thisYear = () => +S.boot.today.slice(0, 4);
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* แคชผลการอ่านไว้ในเบราว์เซอร์: สลับหน้ากลับมาแสดงทันที · ล้างทั้งหมดเมื่อมีการบันทึก/แก้ไข · หมดอายุ 5 นาที */
const READ_APIS = ['dashboard', 'transactions', 'yearSummary', 'recurring', 'invest', 'loans', 'tax', 'health', 'getTable',
  'plan', 'planVsActual', 'projection', 'installments'];
const API_CACHE = {};
const CACHE_MS = 5 * 60 * 1000;
function apiRaw(name, args) {
  const t = performance.now();
  const background = !!S.inPrefetch;
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        const env = raw ? JSON.parse(raw) : { r: null, ms: 0 };
        if (!background) showTiming(name, performance.now() - t, env.ms);
        resolve(env.r);
      })
      .withFailureHandler(e => reject(e))
      .api(name, JSON.stringify(args));
  });
}
/** แสดงเวลาโหลดล่าสุดที่มุมซ้ายล่าง: รวมทั้งหมด (เซิร์ฟเวอร์ประมวลผล) */
function showTiming(name, totalMs, serverMs) {
  S.timing = name + ' ' + (totalMs / 1000).toFixed(1) + 's (เซิร์ฟเวอร์ ' + (serverMs / 1000).toFixed(1) + 's)';
  renderVer();
}
function renderVer() {
  const el = $('#ver');
  if (!el) return;
  const b = S.boot || {};
  const running = b.runningVersion && b.runningVersion !== 'dev' ? b.runningVersion : (b.codeVersion || '-');
  el.innerHTML = 'เวอร์ชัน ' + esc(running) +
    (S.pageLoad ? '<br>เปิดเว็บ ' + (S.pageLoad / 1000).toFixed(1) + 's' : '') +
    (S.timing ? '<br>' + esc(S.timing) : '');
}
function api(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (READ_APIS.indexOf(name) >= 0) {
    const key = name + JSON.stringify(args);
    const hit = API_CACHE[key];
    if (hit && Date.now() - hit.t < CACHE_MS) return Promise.resolve(JSON.parse(hit.v));
    return apiRaw(name, args).then(r => { API_CACHE[key] = { t: Date.now(), v: JSON.stringify(r) }; return r; });
  }
  if (['bootstrap', 'updateInfo', 'upload'].indexOf(name) < 0) clearApiCache(); // คำสั่งเขียนข้อมูล
  return apiRaw(name, args);
}
function clearApiCache() { Object.keys(API_CACHE).forEach(k => delete API_CACHE[k]); }

let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), isErr ? 6000 : 2500);
}
function errMsg(e) { return (e && e.message) ? e.message : String(e); }

function opts(list, selected, withBlank) {
  return (withBlank ? '<option value="">— เลือก —</option>' : '') +
    list.map(o => {
      const v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o;
      return '<option value="' + esc(v) + '"' + (String(v) === String(selected) ? ' selected' : '') + '>' + esc(l) + '</option>';
    }).join('');
}
const cats = (type, includeName) => S.boot.categories.filter(c => c.Type === type && (c.Active || c.Name === includeName)).map(c => c.Name);
const accounts = include => S.boot.accounts.filter(a => a.Active || a.Name === include).map(a => a.Name);
const activeFunds = () => S.boot.funds.filter(f => f.Active);
const normName = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const fundByItem = name => S.boot.funds.find(f => normName(f.Name) === normName(name));
const itemsOf = (type, cat) => (S.boot.planItems || []).filter(i => i.Type === type && i.Category === cat).map(i => i.Name);
/** ช่องเลือกรายการย่อย (แสดงเมื่อหมวดมีรายการย่อยในแผน) */
const normItem = s => String(s || '').replace(/\s+/g, '').toLowerCase();
/** ชื่อรายการย่อยที่เลือกได้: จากแผนก่อน แล้วตามด้วยชื่อที่เคยบันทึก (ไม่ซ้ำแบบไม่สนเว้นวรรค/ตัวพิมพ์) */
function itemSuggestions(type, cat) {
  const out = [], seen = {};
  const add = n => { const k = normItem(n); if (k && !seen[k]) { seen[k] = true; out.push(n); } };
  itemsOf(type, cat).forEach(add);
  Object.keys(S.txCache || {}).forEach(y => (S.txCache[y] || []).forEach(t => { if (t.Type === type && t.Category === cat && t.Item) add(t.Item); }));
  return out;
}
/** ช่องรายการย่อย: เลือกจากรายการ (ไม่ต้องพิมพ์ จับคู่กับแผนแน่นอน) หรือพิมพ์ชื่อใหม่แล้วเพิ่มเข้าแผนได้ */
function itemFieldHtml(type, cat, selected) {
  return '<div class="field item-field' + (cat ? '' : ' hidden') + '"><span>รายการย่อย (ไม่บังคับ)</span>' +
    '<select name="ItemSel">' + itemOptionsHtml(type, cat, selected) + '</select>' +
    '<div class="item-new hidden" style="margin-top:6px;display:flex;flex-direction:column;gap:6px">' +
    '<input name="ItemNew" placeholder="ชื่อรายการย่อยใหม่ เช่น โทรศัพท์พ่อ">' +
    '<label class="small"><input type="checkbox" name="ItemAddPlan" checked> เพิ่มเข้าแผนด้วย (ใช้จำนวนเงินนี้เป็นยอดต่อเดือน)</label></div>' +
    '<span class="small muted item-hint">' + itemHint(type, cat) + '</span></div>';
}
function itemOptionsHtml(type, cat, selected) {
  const list = cat ? itemSuggestions(type, cat) : [];
  const planNames = itemsOf(type, cat).map(normItem);
  let sel = '';
  if (selected) sel = list.find(n => normItem(n) === normItem(selected)) || '';
  if (selected && !sel) { list.push(selected); sel = selected; }
  return '<option value="">— ไม่ระบุ —</option>' +
    list.map(n => '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(n) + (planNames.indexOf(normItem(n)) >= 0 ? '' : ' (ไม่อยู่ในแผน)') + '</option>').join('') +
    '<option value="__new">＋ พิมพ์ชื่อใหม่…</option>';
}
function itemHint(type, cat) {
  if (!cat) return '';
  return itemsOf(type, cat).length ? 'เลือกให้ตรงกับรายการในแผน เพื่อเทียบแผน vs จริงได้' : 'หมวดนี้ยังไม่มีรายการย่อยในแผน · เลือก "พิมพ์ชื่อใหม่" เพื่อเพิ่ม';
}
function bindItemField(root) {
  const box = $('.item-field', root);
  const sync = reset => {
    const f = readForm(root);
    box.classList.toggle('hidden', !f.Category);
    if (reset) $('select[name=ItemSel]', box).innerHTML = itemOptionsHtml(f.Type, f.Category, '');
    $('.item-new', box).classList.toggle('hidden', $('select[name=ItemSel]', box).value !== '__new');
    $('.item-hint', box).innerHTML = itemHint(f.Type, f.Category);
  };
  $('select[name=Category]', root).addEventListener('change', () => sync(true));
  $$('input[name=Type]', root).forEach(r => r.addEventListener('change', () => sync(true)));
  $('select[name=ItemSel]', box).addEventListener('change', () => { sync(false); if ($('select[name=ItemSel]', box).value === '__new') $('input[name=ItemNew]', box).focus(); });
  sync(false);
}
/** อ่านค่ารายการย่อยจากฟอร์ม (ชื่อใหม่ที่ตรงกับแผนแบบไม่สนเว้นวรรค จะใช้ชื่อในแผน) และเพิ่มเข้าแผนถ้าติ๊กไว้ */
async function itemValue(form, type, cat, amount) {
  const sel = ($('select[name=ItemSel]', form) || {}).value || '';
  if (sel !== '__new') return sel;
  const typed = String(($('input[name=ItemNew]', form) || {}).value || '').trim().replace(/\s+/g, ' ');
  if (!typed) throw new Error('กรุณาพิมพ์ชื่อรายการย่อย หรือเลือก "ไม่ระบุ"');
  const match = itemsOf(type, cat).find(n => normItem(n) === normItem(typed));
  if (match) return match;
  if ($('input[name=ItemAddPlan]', form).checked) {
    await api('savePlanItem', { Type: type, Category: cat, Name: typed, DefaultAmount: amount || 0 });
    S.boot = await api('bootstrap');
  }
  return typed;
}
const catLabel = t => esc(t.Category) + (t.Item ? ' <span class="muted">› ' + esc(t.Item) + '</span>' : '');

function field(label, html, cls) { return '<label class="field ' + (cls || '') + '"><span>' + label + '</span>' + html + '</label>'; }

function readForm(form) {
  const o = {};
  $$('[name]', form).forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type !== 'file') o[el.name] = el.value;
  });
  return o;
}

function readFileB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function uploadIfAny(input, kind) {
  const file = input && input.files && input.files[0];
  if (!file) return null;
  if (file.size > 15 * 1024 * 1024) throw new Error('ไฟล์ใหญ่เกิน 15MB');
  const base64 = await readFileB64(file);
  const res = await api('upload', { name: file.name, mimeType: file.type, base64, kind });
  return res.url;
}

/* ---------- Modal ---------- */
const M = { onSubmit: null };
function openModal(o) {
  $('#modal-title').textContent = o.title;
  // สร้าง #modal-body ใหม่ทุกครั้ง เพื่อล้าง event listener ของ modal ก่อนหน้า
  const oldBody = $('#modal-body');
  const body = oldBody.cloneNode(false);
  oldBody.replaceWith(body);
  body.innerHTML = o.body;
  $('#modal-error').textContent = '';
  $('#modal-submit').textContent = o.submitText || 'บันทึก';
  $('#modal-submit').classList.toggle('hidden', o.noSubmit === true);
  $('.modal-box').classList.toggle('wide', !!o.wide);
  $('.modal-box').style.width = o.width || '';
  $('#modal').classList.remove('hidden');
  M.onSubmit = o.onSubmit;
  if (o.onOpen) o.onOpen($('#modal-body'));
  const first = $('#modal-body input:not([type=hidden]):not([type=checkbox]), #modal-body select');
  if (first && !o.noFocus) first.focus();
}
function closeModal() { $('#modal').classList.add('hidden'); M.onSubmit = null; }
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
$('#modal-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!M.onSubmit) return closeModal();
  const btn = $('#modal-submit');
  btn.disabled = true;
  $('#modal-error').textContent = '';
  try {
    const done = await M.onSubmit($('#modal-form'));
    if (done !== false) closeModal();
  } catch (err) {
    $('#modal-error').textContent = errMsg(err);
  } finally {
    btn.disabled = false;
  }
});

async function confirmAction(msg, fn) {
  if (!confirm(msg)) return;
  try { await fn(); } catch (e) { toast(errMsg(e), true); }
}

/* ---------- Charts ---------- */
function chart(id, config) {
  if (S.charts[id]) S.charts[id].destroy();
  const el = document.getElementById(id);
  if (!el) return;
  if (typeof Chart === 'undefined') { // Chart.js ยังโหลดไม่เสร็จ (โหลดแบบไม่ขวางหน้าเว็บ) — รอแล้ววาดทีหลัง
    window.addEventListener('load', () => { if (document.getElementById(id) === el) chart(id, config); }, { once: true });
    return;
  }
  Chart.defaults.color = cssVar('--muted');
  Chart.defaults.borderColor = cssVar('--line');
  Chart.defaults.font.family = "'IBM Plex Sans Thai', system-ui, sans-serif";
  S.charts[id] = new Chart(el, config);
}
const moneyTick = { callback: v => fmt(v, 0) };
const moneyTooltip = { callbacks: { label: c => (c.dataset.label ? c.dataset.label + ': ' : '') + money(c.parsed.y) } };

/* ---------- Router ---------- */
const PAGES = {};
function go(page) {
  S.page = page;
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  Object.keys(S.charts).forEach(k => { S.charts[k].destroy(); delete S.charts[k]; });
  const token = ++S.token;
  $('#main').innerHTML = '<div class="loading">กำลังโหลด…</div>';
  Promise.resolve(PAGES[page](token)).catch(e => {
    if (token === S.token) $('#main').innerHTML = '<div class="panel error">เกิดข้อผิดพลาด: ' + esc(errMsg(e)) + '</div>';
  });
}
function stale(token) { return token !== S.token; }
function refresh() { go(S.page); }
function hardRefresh() { clearApiCache(); go(S.page); }
$$('#nav a').forEach(a => a.addEventListener('click', () => go(a.dataset.page)));

function head(title, toolbar) {
  return '<div class="page-head"><h1>' + title + '</h1><div class="toolbar">' + (toolbar || '') + '</div></div>';
}

/* =========================================================
 * ภาพรวม
 * ========================================================= */
PAGES.dashboard = async token => {
  const month = S.dashMonth || thisMonth();
  const d = await api('dashboard', month);
  if (stale(token)) return;
  const c = d.cards;
  const rateCls = c.savingRate >= c.savingTarget ? 'income' : 'expense';
  const range = cycleRangeLabel(month);
  let html = head('ภาพรวม' + (range ? ' <span class="muted small" style="font-weight:400">รอบ ' + monthLabel(month) + ' · ' + range + '</span>' : ''),
    '<input type="month" id="dash-month" value="' + month + '" title="' + (range ? 'เลือกรอบเดือน (ตั้งชื่อตามเดือนที่รอบสิ้นสุด)' : 'เลือกเดือน') + '"><button class="btn primary" id="dash-add">+ บันทึกรายการ</button>');
  html += '<div class="grid cards">' +
    cardHtml('รายรับ', money(c.income), 'income', c.interest ? 'รวมดอกเบี้ยเงินให้ยืม ' + money(c.interest) : '') +
    cardHtml('รายจ่าย', money(c.expense), 'expense') +
    cardHtml('เงินออม/ลงทุน', money(c.saving), 'saving', c.withdraw ? 'สุทธิ หลังดึงออกมาใช้ ' + money(c.withdraw) : '') +
    cardHtml('คงเหลือ', money(c.remaining), c.remaining >= 0 ? 'income' : 'expense') +
    cardHtml('อัตราการออม', fmt(c.savingRate, 1) + '%', rateCls, 'เป้า ' + c.savingTarget + '% ของรายรับ') +
    '</div>';

  if (d.planAlerts.length) {
    html += '<div class="panel" style="margin-bottom:16px;border-color:var(--bad)"><b class="expense">⚠️ เดือนที่แผนคาดว่าเงินไม่พอ:</b> ' +
      d.planAlerts.map(a => monthLabel(a.month) + ' (ขาด ฿' + fmt(-a.remaining, 0) + ')').join(' · ') +
      ' <a class="small" data-go="plan">ไปที่แผน →</a></div>';
  }
  const pn = d.planNow;
  html += '<div class="panel" style="margin-bottom:16px"><h2>แผนเดือนนี้ vs จริง<span class="spacer"></span><a class="small" data-go="plan">ดูแผน →</a></h2><div class="grid cards" style="margin:0">' +
    planCmpCard('รายรับ', pn.income, c.income, true) + planCmpCard('รายจ่าย', pn.expense, c.expense, false) +
    planCmpCard('เงินออม', pn.saving - (pn.withdraw || 0), c.saving, true) + planCmpCard('คงเหลือ', pn.remaining, c.remaining, true) + '</div>' +
    '<h2 style="margin-top:18px">เงินรอบนี้ไปไหนบ้าง<span class="spacer"></span><span class="small muted">กด "จ่าย" / "ออม" เพื่อบันทึกที่ลิงก์กับแผน</span></h2>' +
    allocationHtml(d, pn, c) + '</div>';
  html += '<div class="grid three" style="margin-bottom:16px">' +
    '<div class="panel"><h2>แนวโน้ม 12 เดือน</h2><div class="chart-box"><canvas id="ch-trend"></canvas></div></div>' +
    '<div class="panel"><h2>งบประมาณรายหมวด · ' + monthLabel(month) + '</h2>' + budgetsHtml(d.budgets) + '</div></div>';

  html += '<div class="grid two">' +
    '<div class="panel"><h2>เป้าหมายการออม<span class="spacer"></span><a class="small" data-go="invest">ดูทั้งหมด →</a></h2>' + goalsHtml(d.goals) + refillHtml(d.refill) + '</div>' +
    '<div class="panel"><h2>เงินให้ยืมที่ยังค้าง<span class="spacer"></span><span class="badge info">' + money(d.loans.total) + '</span></h2>' + loansMiniHtml(d.loans.list) + '</div>' +
    '<div class="panel"><h2>รายจ่ายตามหมวด · ' + monthLabel(month) + '</h2>' + expenseCatHtml(d.expenseByCat, c.expense) + '</div>' +
    '<div class="panel"><h2>รายการประจำที่ยังไม่บันทึกเดือนนี้</h2>' + recurringMiniHtml(d.recurringPending.concat(d.installmentsPending.map(i => Object.assign({}, i, { Name: i.Name + ' (งวด ' + (i.paid + 1) + '/' + i.months + ')', inst: true })))) + '</div>' +
    '</div>';
  $('#main').innerHTML = html;

  $('#dash-month').addEventListener('change', e => { S.dashMonth = e.target.value; refresh(); });
  $('#dash-add').addEventListener('click', () => txModal(null, refresh));
  $$('[data-pay]').forEach(b => b.addEventListener('click', async () => {
    const c = d.checklist[+b.dataset.pay];
    if (c.installment) {
      if (c.remaining <= 0) return toast('งวดนี้บันทึกจ่ายแล้ว');
      b.disabled = true;
      try { await api('postInstallments', [c.installment], d.month); toast('บันทึกงวดผ่อนแล้ว'); S.txCache = {}; clearApiCache(); refresh(); }
      catch (e) { b.disabled = false; toast(errMsg(e), true); }
      return;
    }
    txModal(null, () => { S.txCache = {}; clearApiCache(); refresh(); },
      { Type: EXPENSE, Category: c.category, Item: c.item, Amount: c.remaining || c.plan, Note: c.item || c.category });
  }));
  $$('[data-dsave]').forEach(b => b.addEventListener('click', async () => {
    const i = d.savingsPlan.items[+b.dataset.dsave];
    if (!S.investFunds) { try { S.investFunds = (await api('invest')).funds; } catch (e) { /* ใช้ข้อมูลพื้นฐาน */ } }
    contributionModal(null, i && i.fund ? { [i.fund]: i.remaining } : {});
  }));
  $$('[data-go]').forEach(a => a.addEventListener('click', () => go(a.dataset.go)));
  const postAll = $('#post-recurring');
  if (postAll) postAll.addEventListener('click', async () => {
    try {
      const n = await api('postRecurring', d.recurringPending.map(r => r.ID), thisMonth());
      const m = d.installmentsPending.length ? await api('postInstallments', d.installmentsPending.map(i => i.ID), thisMonth()) : 0;
      S.txCache = {};
      toast('บันทึกแล้ว ' + (n + m) + ' รายการ'); refresh();
    } catch (e) { toast(errMsg(e), true); }
  });

  chart('ch-trend', {
    type: 'bar',
    data: {
      labels: d.trend.map(t => monthLabel(t.month)),
      datasets: [
        { label: 'รายรับ', data: d.trend.map(t => t.income), backgroundColor: cssVar('--income') },
        { label: 'รายจ่าย', data: d.trend.map(t => t.expense), backgroundColor: cssVar('--expense') },
        { label: 'เงินออม', data: d.trend.map(t => t.saving), backgroundColor: cssVar('--saving') },
      ],
    },
    options: { maintainAspectRatio: false, scales: { y: { ticks: moneyTick } }, plugins: { tooltip: moneyTooltip } },
  });
};

function cardHtml(label, value, cls, sub) {
  return '<div class="card"><div class="label">' + label + '</div><div class="value ' + (cls || '') + '">' + value + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
}
function barHtml(pct, cls) {
  return '<div class="bar ' + (cls || '') + '"><div style="width:' + Math.min(100, Math.max(0, pct)).toFixed(1) + '%"></div></div>';
}
function budgetsHtml(list) {
  if (!list.length) return '<div class="empty">ยังไม่ได้ตั้งงบ — ตั้งได้ที่หน้า ตั้งค่า</div>';
  return list.map(b => {
    const pct = b.budget ? b.spent / b.budget * 100 : 0;
    const cls = pct > 100 ? 'bad' : pct >= 80 ? 'warn' : 'ok';
    const left = b.budget - b.spent;
    return '<div class="budget-row"><div class="top"><span>' + esc(b.category) + '</span><span class="small ' + (left < 0 ? 'expense' : 'muted') + '">' +
      money(b.spent) + ' / ' + money(b.budget) + (left < 0 ? ' · เกิน ' + money(-left) : '') + '</span></div>' + barHtml(pct, cls) + '</div>';
  }).join('');
}
function goalsHtml(goals) {
  return goals.map(g => {
    const pct = g.target ? g.value / g.target * 100 : 0;
    const need = g.date && g.target ? (g.value >= g.target ? '<span class="income">ถึงเป้าแล้ว 🎉</span>' :
      'ต้องออมเดือนละ <b>' + money(g.monthlyNeeded) + '</b> ถึง ' + monthLabel(g.date) + ' (' + g.monthsLeft + ' เดือน)') : '';
    return '<div class="budget-row"><div class="top"><span>' + esc(g.goal) + '</span><span class="small muted">' + money(g.value) +
      (g.target ? ' / ' + money(g.target) + ' · ' + fmt(pct, 1) + '%' : '') + '</span></div>' + (g.target ? barHtml(pct, pct >= 100 ? 'ok' : '') : '') +
      (need ? '<div class="small muted" style="margin-top:3px">' + need + '</div>' : '') + '</div>';
  }).join('') || '<div class="empty">ยังไม่มีเป้าหมาย — ตั้งได้ที่ ตั้งค่า → เป้าหมายการออม</div>';
}

/** แผนออมรอบนี้ (จากแผนรายเดือน) เทียบกับที่ลงเงินจริง */
function savingsPlanHtml(sp) {
  if (!sp) return '';
  const pct = sp.plan ? sp.done / sp.plan * 100 : 0;
  let html = '<div class="panel" style="margin-bottom:16px"><h2>แผนออมรอบ ' + monthLabel(sp.month) + '<span class="spacer"></span><a class="small" data-go="plan">แก้แผน →</a></h2>' +
    '<div class="grid cards" style="margin-bottom:10px">' + cardHtml('ต้องออมตามแผน', money(sp.plan), 'saving') + cardHtml('ลงเงินแล้ว', money(sp.done), 'income', sp.withdrawn ? 'ดึงออกมาใช้ ' + money(sp.withdrawn) : '') +
    cardHtml('ยังต้องออมอีก', money(sp.remaining), sp.remaining > 0 ? 'expense' : 'income', sp.remaining > 0 ? '' : 'ครบตามแผนแล้ว') + '</div>' + barHtml(pct, pct >= 100 ? 'ok' : '');
  if (sp.items.length) {
    html += '<table class="data" style="margin-top:10px"><thead><tr><th>รายการ</th><th class="num">แผน</th><th class="num">ลงแล้ว</th><th class="num">เหลือ</th><th></th></tr></thead><tbody>' +
      sp.items.map((i, k) => '<tr><td>' + esc(i.name) + (i.fund ? '' : ' <span class="badge warn" title="ตั้งชื่อรายการย่อยให้ตรงกับชื่อกอง เพื่อจับคู่">ไม่ตรงกับกอง</span>') + '</td><td class="num">' + fmt(i.plan, 0) +
        '</td><td class="num">' + fmt(i.done, 0) + '</td><td class="num">' + (i.remaining ? fmt(i.remaining, 0) : '<span class="badge ok">ครบ</span>') + '</td><td>' +
        (i.fund && i.remaining ? '<button class="btn sm primary" data-save-fund="' + k + '">ออม</button>' : '') + '</td></tr>').join('') + '</tbody></table>';
  } else {
    html += '<p class="muted small" style="margin-bottom:0">อยากรู้ว่าแต่ละกองต้องลงเท่าไร: ไปที่ แผน/คาดการณ์ → ▸ เงินออม/ลงทุน → เพิ่มรายการย่อย <b>ชื่อเดียวกับกอง</b> (เช่น DIME-JEPQ) แล้วใส่ยอดต่อเดือน</p>';
  }
  return html + '</div>';
}
function loanBadge(status) {
  const cls = status === 'เกินกำหนด' ? 'bad' : status === 'ปิดยอด' ? 'ok' : 'warn';
  return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
}
function loansMiniHtml(list) {
  if (!list.length) return '<div class="empty">ไม่มียอดค้าง 🎉</div>';
  return '<div class="table-wrap" style="max-height:260px"><table class="data"><thead><tr><th>ผู้ยืม</th><th>กำหนดชำระ</th><th class="num">คงเหลือ</th><th></th></tr></thead><tbody>' +
    list.map(l => '<tr><td>' + esc(l.Borrower) + ' <span class="muted small">' + esc(l.LoanID) + '</span></td><td>' + (dateLabel(l.DueDate) || '<span class="muted">-</span>') +
      '</td><td class="num">' + money(l.remaining) + '</td><td>' + loanBadge(l.status) + '</td></tr>').join('') + '</tbody></table></div>';
}
function expenseCatHtml(list, total) {
  if (!list.length) return '<div class="empty">ยังไม่มีรายจ่ายเดือนนี้</div>';
  return list.map(x => '<div class="budget-row"><div class="top"><span>' + esc(x.category) + '</span><span class="small muted">' + money(x.amount) + ' · ' +
    fmt(total ? x.amount / total * 100 : 0, 1) + '%</span></div>' + barHtml(total ? x.amount / total * 100 : 0) + '</div>').join('');
}
/** ตารางเงินรอบนี้: รายจ่ายตามแผน + เงินออมตามแผน + สรุปคงเหลือ */
function allocationHtml(d, pn, c) {
  const row = (label, plan, done, btn, cls) => {
    const rem = Math.max(0, plan - done);
    const pct = plan ? done / plan * 100 : 0;
    const status = !plan && done ? '<span class="badge warn">นอกแผน</span>' : rem <= 0 ? (done > plan ? '<span class="expense">เกิน ' + fmt(done - plan, 0) + '</span>' : '<span class="badge ok">ครบ</span>') : fmt(rem, 0);
    return '<tr' + (rem <= 0 && plan ? ' class="muted"' : '') + '><td>' + label + '</td><td class="num">' + fmt(plan, 0) + '</td><td class="num">' + fmt(done, 0) + '</td><td style="width:140px">' +
      barHtml(pct, pct > 100 ? 'bad' : pct >= 100 ? 'ok' : cls || '') + '</td><td class="num">' + status + '</td><td>' + (btn || '') + '</td></tr>';
  };
  const sec = (title, cls, amountPlan, amountDone) => '<tr class="pl-sec"><td colspan="6"><b class="' + cls + '">' + title + '</b> <span class="small muted">แผน ' + money(amountPlan) + ' · จริง ' + money(amountDone) + '</span></td></tr>';
  let html = '<div class="table-wrap" style="max-height:none"><table class="data"><thead><tr><th>รายการ</th><th class="num">แผน</th><th class="num">จริง</th><th></th><th class="num">เหลือ</th><th></th></tr></thead><tbody>';
  html += sec('รายจ่าย', 'expense', pn.expense, c.expense);
  html += (d.checklist || []).map((x, i) => row(x.item ? esc(x.item) + ' <span class="small muted">' + esc(x.category) + '</span>' : esc(x.category), x.plan, x.paid,
    '<button class="btn sm' + (x.remaining > 0 ? ' primary' : '') + '" data-pay="' + i + '">จ่าย</button>')).join('') ||
    '<tr><td colspan="6" class="muted small">ยังไม่มีแผนรายจ่าย</td></tr>';
  const sp = d.savingsPlan || { items: [], plan: 0, done: 0 };
  html += sec('เงินออม / ลงทุน', 'saving', sp.plan, sp.done);
  if (sp.items.length) {
    html += sp.items.map((i, k) => row(esc(i.name) + (i.fund ? '' : ' <span class="badge warn" title="ตั้งชื่อรายการย่อยของแผนออมให้ตรงกับชื่อกอง">ไม่ตรงกับกอง</span>'), i.plan, i.done,
      i.fund ? '<button class="btn sm' + (i.remaining > 0 ? ' primary' : '') + '" data-dsave="' + k + '">ออม</button>' : '', 'ok')).join('');
  } else {
    html += row('เงินออม/ลงทุน <span class="small muted">(แบ่งรายกองได้ที่แผน → ▸ เงินออม/ลงทุน)</span>', sp.plan, sp.done,
      '<button class="btn sm' + (sp.remaining > 0 ? ' primary' : '') + '" data-dsave="-1">ออม</button>', 'ok');
  }
  if (sp.withdrawn) html += row('ดึงเงินออมออกมาใช้', pn.withdraw || 0, sp.withdrawn, '');
  html += '</tbody><tfoot>' +
    '<tr><td>รายรับ</td><td class="num">' + fmt(pn.income, 0) + '</td><td class="num">' + fmt(c.income, 0) + '</td><td colspan="3"></td></tr>' +
    '<tr><td>− รายจ่าย</td><td class="num">' + fmt(pn.expense, 0) + '</td><td class="num">' + fmt(c.expense, 0) + '</td><td colspan="3"></td></tr>' +
    '<tr><td>− เงินออมสุทธิ</td><td class="num">' + fmt(pn.saving - (pn.withdraw || 0), 0) + '</td><td class="num">' + fmt(c.saving, 0) + '</td><td colspan="3"></td></tr>' +
    '<tr><td>= คงเหลือ (ยังไม่ได้จัดสรร)</td><td class="num ' + (pn.remaining < 0 ? 'expense' : '') + '">' + fmt(pn.remaining, 0) + '</td><td class="num ' + (c.remaining < 0 ? 'expense' : '') + '">' + fmt(c.remaining, 0) + '</td><td colspan="3"></td></tr>' +
    '</tfoot></table></div>';
  return html;
}

function checklistHtml(list) {
  if (!list || !list.length) return '<div class="empty">ยังไม่มีแผนรายจ่ายของรอบนี้ — ตั้งได้ที่ แผน/คาดการณ์</div>';
  return '<div class="table-wrap" style="max-height:360px"><table class="data"><thead><tr><th>รายการ</th><th class="num">แผน</th><th class="num">จ่ายแล้ว</th><th style="width:160px"></th><th class="num">คงเหลือ</th><th></th></tr></thead><tbody>' +
    list.map((c, i) => {
      const pct = c.plan ? c.paid / c.plan * 100 : 0;
      const done = c.remaining <= 0;
      return '<tr' + (done ? ' class="muted"' : '') + '><td>' + (c.item ? esc(c.item) + ' <span class="small muted">' + esc(c.category) + '</span>' : esc(c.category)) + '</td>' +
        '<td class="num">' + fmt(c.plan, 0) + '</td><td class="num">' + fmt(c.paid, 0) + '</td><td>' + barHtml(pct, pct > 100 ? 'bad' : done ? 'ok' : '') + '</td>' +
        '<td class="num">' + (done ? (c.paid > c.plan ? '<span class="expense">เกิน ' + fmt(c.paid - c.plan, 0) + '</span>' : '<span class="badge ok">ครบ</span>') : fmt(c.remaining, 0)) + '</td>' +
        '<td><button class="btn sm' + (done ? '' : ' primary') + '" data-pay="' + i + '">จ่าย</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function refillHtml(list) {
  if (!list || !list.length) return '';
  return '<div class="refill-box"><b>ต้องเติมคืน</b>' + list.map(r => '<div class="budget-row" style="margin:6px 0 0"><div class="top"><span>' + esc(r.fund) +
    '</span><span class="small expense">' + money(r.owed) + '</span></div><div class="small muted">ดึงออกตั้งแต่ ' + dateLabel(r.since) + ' · ลงเงินกองนี้แล้วยอดจะลดลงเอง</div></div>').join('') + '</div>';
}

function planCmpCard(label, plan, actual, higherIsGood) {
  const diff = actual - plan;
  const good = higherIsGood ? diff >= 0 : diff <= 0;
  return '<div class="card"><div class="label">' + label + '</div><div class="value">' + money(actual) + '</div><div class="sub">แผน ' + money(plan) +
    (plan || actual ? ' · <span class="' + (good ? 'income' : 'expense') + '">' + (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff)) + '</span>' : '') + '</div></div>';
}

function recurringMiniHtml(list) {
  if (!list.length) return '<div class="empty">บันทึกครบแล้ว ✓</div>';
  return '<table class="data"><tbody>' + list.map(r => '<tr><td>' + esc(r.Name) + ' <span class="muted small">' + esc(r.Category) + '</span></td><td class="num ' +
    (r.Type === INCOME ? 'income' : 'expense') + '">' + money(r.Amount) + '</td></tr>').join('') +
    '</tbody></table><div style="margin-top:10px;text-align:right"><button class="btn primary sm" id="post-recurring">บันทึกทั้งหมดเข้าเดือนนี้</button></div>';
}

/* =========================================================
 * รายรับ-รายจ่าย
 * ========================================================= */
function txModal(t, after, prefill) {
  const isNew = !t;
  t = t || Object.assign({ Type: EXPENSE, Date: today(), Amount: '', Category: '', Account: '', Note: '', ReceiptUrl: '', Item: '' }, prefill || {});
  const catOpts = type => opts(cats(type, t.Category), t.Category, true);
  openModal({
    title: isNew ? 'บันทึกรายการ' : 'แก้ไขรายการ',
    body: '<div class="form-grid">' +
      '<div class="full"><div class="seg">' +
      '<label><input type="radio" name="Type" value="' + EXPENSE + '"' + (t.Type === EXPENSE ? ' checked' : '') + '>รายจ่าย</label>' +
      '<label><input type="radio" name="Type" value="' + INCOME + '"' + (t.Type === INCOME ? ' checked' : '') + '>รายรับ</label></div></div>' +
      field('วันที่', '<input type="date" name="Date" required value="' + esc(t.Date) + '">') +
      field('จำนวนเงิน (บาท)', '<input type="number" step="0.01" name="Amount" required value="' + esc(t.Amount) + '" inputmode="decimal">') +
      field('หมวด', '<select name="Category" required>' + catOpts(t.Type) + '</select>') +
      itemFieldHtml(t.Type, t.Category, t.Item) +
      field('บัญชี', '<select name="Account">' + opts(accounts(t.Account), t.Account, true) + '</select>') +
      field('รายละเอียด', '<input name="Note" value="' + esc(t.Note) + '" placeholder="เช่น ค่าขนมสัปดาห์นี้">', 'full') +
      field('รูปใบเสร็จ (ไม่บังคับ)', '<input type="file" name="file" accept="image/*,application/pdf">' +
        (t.ReceiptUrl ? '<span class="small">ไฟล์เดิม: <a href="' + esc(t.ReceiptUrl) + '" target="_blank">เปิดดู</a> <label><input type="checkbox" name="removeReceipt"> ลบไฟล์แนบ</label></span>' : ''), 'full') +
      '</div>',
    onOpen: root => {
      $$('input[name=Type]', root).forEach(r => r.addEventListener('change', () => {
        $('select[name=Category]', root).innerHTML = catOpts(readForm(root).Type);
      }));
      bindItemField(root);
      $('input[name=Amount]', root).focus();
    },
    noFocus: true,
    onSubmit: async form => {
      const f = readForm(form);
      if (!f.Date) throw new Error('กรุณาเลือกวันที่');
      if (!num(f.Amount)) throw new Error('กรุณากรอกจำนวนเงิน');
      if (!f.Category) throw new Error('กรุณาเลือกหมวด');
      let url = f.removeReceipt ? '' : t.ReceiptUrl;
      const uploaded = await uploadIfAny($('input[name=file]', form), 'receipt');
      if (uploaded) url = uploaded;
      const item = await itemValue(form, f.Type, f.Category, num(f.Amount));
      await api('saveTransaction', { ID: t.ID, Date: f.Date, Type: f.Type, Category: f.Category, Amount: num(f.Amount), Account: f.Account, Note: f.Note, ReceiptUrl: url, Item: item });
      delete S.txCache[f.Date.slice(0, 4)];
      if (t.Date) delete S.txCache[t.Date.slice(0, 4)];
      toast('บันทึกแล้ว');
      if (after) after();
    },
  });
}

function yearOptions(selected, extra) {
  const ys = new Set([thisYear(), thisYear() - 1, thisYear() - 2, 2024].concat(extra || []));
  return opts(Array.from(ys).sort((a, b) => b - a), selected);
}

  const tab = S.txTab;
  const tabs = '<div class="tabs">' + [['list', 'รายการ'], ['summary', 'สรุปรายปี'], ['recurring', 'รายการประจำเดือน']]
    .map(t => '<a data-tab="' + t[0] + '" class="' + (tab === t[0] ? 'active' : '') + '">' + t[1] + '</a>').join('') + '</div>';

  $$('.tabs a').forEach(a => a.addEventListener('click', () => { S.txTab = a.dataset.tab; refresh(); }));
  $('#tx-add').addEventListener('click', () => txModal(null, refresh));
  body.bind && body.bind();
};

    '<select id="f-cat"><option value="">ทุกหมวด</option>' + opts(catNames, F.cat) + '</select>' +
    '<select id="f-acc"><option value="">ทุกบัญชี</option>' + opts(accNames, F.acc) + '</select>' +
    '<input id="f-q" placeholder="ค้นหา…" value="' + esc(F.q || '') + '" style="flex:1;min-width:140px">' +
    '</div>' +
    '<div class="toolbar small" style="margin-bottom:8px"><span>' + list.length + ' รายการ</span><span class="income">รายรับ ' + money(inc) + '</span><span class="expense">รายจ่าย ' + money(exp) + '</span><span>สุทธิ ' + money(inc - exp) + '</span></div>' +
    '<div class="table-wrap"><table class="data"><thead><tr><th>วันที่</th><th>หมวด</th><th>รายละเอียด</th><th>บัญชี</th><th class="num">จำนวน</th><th></th></tr></thead><tbody>' +

PAGES.invest = async token => {

  if (stale(token)) return;
  S.usdRate = d.usdRate;
  const totalCost = d.funds.reduce((s, f) => s + f.cost, 0);
  const totalValue = d.funds.reduce((s, f) => s + f.valueTHB, 0);
  const goals = d.goals;

  S.investFunds = d.funds;
  let html = head('เงินออม / ลงทุน', '<span class="muted small">USD/THB ' + fmt(d.usdRate, 2) + '</span><button class="btn ghost" id="inv-reset">เริ่มต้นใหม่</button><button class="btn" id="inv-withdraw">ดึงเงินออกมาใช้</button><button class="btn" id="inv-div">รับเงินปันผล</button><button class="btn" id="inv-snap">อัปเดตยอด / NAV</button><button class="btn primary" id="inv-add">+ ลงเงิน</button>');

        (f.livePrice ? ' <span class="badge ok">ราคาล่าสุด' + (f.priceCurrency === 'USD' ? ' $' + fmt(f.priceFX, 2) : '') + '</span>' : '') + (f.navDate && !f.livePrice ? ' (' + dateLabel(f.navDate) + ')' : '') + '</div>' : '') +
      '</td><td>' + esc(f.Goal) + '</td><td class="num">' + money(f.cost) +
      '</td><td class="num">' + money(f.valueTHB) + (f.Currency === 'USD' ? '<div class="small muted">$' + fmt(f.valueFX, 2) + '</div>' : '') + '</td><td class="num ' + (f.gain >= 0 ? 'income' : 'expense') + '">' + (f.gain >= 0 ? '+' : '') + fmt(f.gain) +
      (f.cost ? '<div class="small">' + fmt(f.gain / f.cost * 100, 2) + '%</div>' : '') + '</td><td class="small muted">' + (f.lastSnapshot ? monthLabel(f.lastSnapshot) : 'ยังไม่บันทึก') + '</td>' +
      '<td style="white-space:nowrap">' + (f.Active ? '<button class="btn sm" data-buy="' + esc(f.Name) + '">' + (isUnitKind(f.Kind) ? 'ซื้อ' : 'ฝาก') + '</button> ' +
        (f.valueTHB > 0 ? '<button class="btn sm" data-sell="' + esc(f.Name) + '">' + (isUnitKind(f.Kind) ? 'ขาย' : 'ถอน') + '</button>' : '') : '') + '</td></tr>').join('') +
    '</tbody></table><p class="muted small">มูลค่าปัจจุบัน = ยอดที่บันทึกล่าสุด + เงินที่ลงเพิ่มหลังจากนั้น (กอง USD คิดด้วยอัตราแลกเปลี่ยนปัจจุบัน)</p></div>' +
    '<div class="panel"><h2>ความคืบหน้าเป้าหมาย</h2>' + goalsHtml(goals) + refillHtml(d.refill) + dividendHtml(d.dividends) + '</div></div>';

    (blist.length ? blist.map(b => {
      const wd = b[0].Source === 'withdraw', tf = b[0].Source === 'transfer';
      const total = tf ? b.filter(c => c.Cash > 0).reduce((s, c) => s + c.Cash, 0) : b.reduce((s, c) => s + c.Cash, 0);

        (c.Currency === 'USD' ? ' <span class="muted small">($' + fmt(Math.abs(c.AmountFX), 2) + ' @' + fmt(c.Rate, 2) + ')</span>' : '') +
        (c.Units ? ' <span class="muted small">(' + fmt(Math.abs(c.Units), 4) + ' หน่วย)</span>' : '')).join('<br>') +
        '</td><td>' + esc(b[0].Account) + '</td><td>' + (tf ? '<span class="badge info">ย้ายระหว่างกอง</span> ' : '') + (wd ? '<span class="badge warn">ดึงออกมาใช้</span>' + (b[0].Refill ? ' <span class="badge">ต้องเติมคืน</span>' : '') + ' ' : '') + esc(b[0].Note) +
        (b[0].Source.indexOf('import') === 0 ? ' <span class="badge">นำเข้า</span>' : '') + (b[0].Source === 'opening' ? ' <span class="badge info">ยอดตั้งต้น</span>' : '') +
        '</td><td class="num ' + (wd ? 'expense' : 'saving') + '">' + (wd ? '−' : '') + money(Math.abs(total)) +
        '</td><td style="white-space:nowrap">' + (wd || tf ? '' : '<button class="icon-btn" data-bedit="' + esc(b[0].BatchID) + '">✏️</button>') +
        '<button class="icon-btn" data-bdel="' + esc(b[0].BatchID) + '">🗑</button></td></tr>';
    }).join('')
      : '<tr><td colspan="6" class="empty">ยังไม่มีการลงเงิน</td></tr>') + '</tbody></table></div></div>';
  $('#main').innerHTML = html;

  $('#inv-add').addEventListener('click', () => contributionModal(null));
  $('#inv-reset').addEventListener('click', () => resetInvestModal(d));
  $('#inv-withdraw').addEventListener('click', () => withdrawModal(d, {}));
  $('#inv-div').addEventListener('click', () => dividendModal(d));
  $$('[data-buy]').forEach(b => b.addEventListener('click', () => contributionModal(null, { [b.dataset.buy]: '' })));
  $$('[data-sell]').forEach(b => b.addEventListener('click', () => withdrawModal(d, { fund: b.dataset.sell })));
  $$('[data-save-fund]').forEach(b => b.addEventListener('click', () => {
    const i = d.savingsPlan.items[+b.dataset.saveFund];
    contributionModal(null, { [i.fund]: i.remaining });
  }));
  $$('[data-go]').forEach(a => a.addEventListener('click', () => go(a.dataset.go)));
  $('#inv-snap').addEventListener('click', () => snapshotModal(d));
  $$('[data-bedit]').forEach(b => b.addEventListener('click', () => contributionModal(batches[b.dataset.bedit])));
  $$('[data-bdel]').forEach(b => b.addEventListener('click', () => confirmAction('ลบการลงเงินครั้งนี้ทั้งหมด?', async () => {
    await api('deleteContributionBatch', b.dataset.bdel); toast('ลบแล้ว'); refresh();
  })));

  // กราฟ: เงินต้นสะสม vs มูลค่าที่บันทึกรายเดือน
  const months = Array.from(new Set(d.contributions.map(c => c.Date.slice(0, 7)).concat(d.snapshots.map(s => s.Month)))).sort();
  let cum = 0;
  const costByMonth = months.map(m => { cum += d.contributions.filter(c => c.Date.slice(0, 7) === m).reduce((s, c) => s + c.AmountTHB, 0); return cum; });
  const snapTotal = months.map(m => { const ss = d.snapshots.filter(s => s.Month === m); return ss.length ? ss.reduce((s, x) => s + x.ValueTHB, 0) : null; });
  chart('ch-inv', {
    type: 'line',
    data: {
      labels: months.map(monthLabel),
      datasets: [
        { label: 'เงินต้นสะสม', data: costByMonth, borderColor: cssVar('--muted'), backgroundColor: 'transparent', tension: .2, pointRadius: 0 },
        { label: 'มูลค่าที่บันทึก', data: snapTotal, borderColor: cssVar('--saving'), backgroundColor: cssVar('--saving'), spanGaps: true, tension: .2 },
      ],
    },
    options: { maintainAspectRatio: false, scales: { y: { ticks: moneyTick } }, plugins: { tooltip: moneyTooltip } },
  });
};

const KIND_FUND_UI = 'กองทุนรวม';
const KIND_STOCK_UI = 'หุ้น';
const isUnitKind = k => k === KIND_FUND_UI || k === KIND_STOCK_UI;
const unitWord = k => (k === KIND_STOCK_UI ? 'หุ้น' : 'หน่วย');
const priceWord = k => (k === KIND_STOCK_UI ? 'ราคา' : 'NAV');
function contributionModal(batch, prefill) {
  const first = batch ? batch[0] : null;
  prefill = prefill || {};
  const valFunds = S.investFunds || [];
  const funds = activeFunds();
  const byFund = {};
  (batch || []).forEach(c => { byFund[c.Fund] = c; });
  // แสดงทุกกองที่ใช้งาน + กองในรายการเดิม (ถ้าถูกปิดไปแล้ว)
  const names = funds.map(f => f.Name).concat(Object.keys(byFund).filter(n => !funds.some(f => f.Name === n)));
  const fundOf = n => valFunds.find(f => f.Name === n) || S.boot.funds.find(f => f.Name === n) || { Name: n, Currency: 'THB' };
  const rows = names.map(n => {
    const f = fundOf(n), c = byFund[n] || (prefill[n] !== undefined && prefill[n] !== '' ? { AmountTHB: prefill[n] } : null);
    const usd = f.Currency === 'USD', isFund = isUnitKind(f.Kind);
    const nav = c && c.Units ? Math.round(c.AmountTHB / c.Units * 10000) / 10000 : (f.nav || f.NAV || '');
    return '<tr data-fund="' + esc(n) + '" data-kind="' + esc(f.Kind || '') + '"><td>' + esc(n) + ' <span class="badge">' + esc(f.Kind || f.Currency) + '</span></td>' +
      '<td><input type="number" step="0.01" class="l-thb" value="' + (c ? c.AmountTHB : '') + '" placeholder="0" style="text-align:right"></td>' +
      '<td>' + (usd ? '<input type="number" step="0.0001" class="l-rate" value="' + (c ? c.Rate : (S.usdRate || S.boot.usdRate)) + '" style="text-align:right" title="อัตราแลกเปลี่ยน">'
        : isFund ? '<input type="number" step="0.0001" class="l-nav" value="' + nav + '" placeholder="' + priceWord(f.Kind) + '" style="text-align:right" title="' + priceWord(f.Kind) + ' ที่ซื้อ">'
        : '<span class="muted">-</span>') + '</td>' +
      '<td class="num l-fx muted"></td></tr>';
  }).join('');
  openModal({
    title: batch ? 'แก้ไขการลงเงิน' : 'ลงเงินออม/ลงทุน',
    wide: true,
    body: '<div class="form-grid" style="margin-bottom:12px">' +
      field('วันที่', '<input type="date" name="date" value="' + (first ? first.Date : today()) + '">') +
      field('จ่ายจากบัญชี', '<select name="account">' + opts(accounts(first && first.Account), first ? first.Account : '', true) + '</select>') +
      (batch ? '' : field('เงินมาจาก', '<select name="sourceFund"><option value="">เงินใหม่ (นับเป็นเงินออมของเดือน)</option>' +
        valFunds.filter(f => f.Active && f.valueTHB > 0).map(f => '<option value="' + esc(f.Name) + '">ย้ายจากกอง ' + esc(f.Name) + ' (' + money(f.valueTHB) + ')</option>').join('') + '</select>', 'full')) +
      field('หมายเหตุ', '<input name="note" value="' + esc(first ? first.Note : '') + '">', 'full') + '</div>' +
      '<table class="data lines-table"><thead><tr><th>กอง</th><th>จำนวนเงิน (บาท)</th><th>อัตราแลกเปลี่ยน / NAV ที่ซื้อ</th><th class="num">ได้</th></tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td>รวม</td><td class="num" id="l-total">฿0</td><td></td><td></td></tr></tfoot></table>' +
      '<p class="muted small">ใส่เฉพาะกองที่ลงเงินครั้งนี้ ช่องที่ว่างไว้จะไม่ถูกบันทึก · กองทุนรวม/หุ้นใส่ราคาที่ซื้อ ระบบคำนวณจำนวนหน่วยให้ · ' +
      'ถ้าใช้เงินที่เก็บไว้ในกองอื่น (เช่น เงินปันผลสะสม) เลือก "ย้ายจากกอง…" จะไม่ถูกนับเป็นเงินออมซ้ำ</p>',
    onOpen: root => {
      const pf = Object.keys(prefill)[0];
      if (pf) { const el = $('tr[data-fund="' + CSS.escape(pf) + '"] .l-thb', root); if (el) setTimeout(() => el.focus(), 50); }
      const recalc = () => {
        let total = 0;
        $$('tr[data-fund]', root).forEach(tr => {
          const thb = num($('.l-thb', tr).value);
          total += thb;
          const rate = $('.l-rate', tr), nav = $('.l-nav', tr);
          let out = '';
          if (rate && thb && num(rate.value)) out = '$' + fmt(thb / num(rate.value), 2);
          if (nav && thb && num(nav.value)) out = fmt(thb / num(nav.value), 4) + ' ' + unitWord(tr.dataset.kind);
          $('.l-fx', tr).textContent = out;
        });
        $('#l-total', root).textContent = money(total);
      };
      root.addEventListener('input', recalc);
      recalc();
    },
    onSubmit: async form => {
      const f = readForm(form);
      const lines = $$('tr[data-fund]', form).map(tr => ({
        fund: tr.dataset.fund, amountTHB: num($('.l-thb', tr).value),
        rate: $('.l-rate', tr) ? num($('.l-rate', tr).value) : 1,
        nav: $('.l-nav', tr) ? num($('.l-nav', tr).value) : '',
      })).filter(l => l.amountTHB);
      if (!lines.length) throw new Error('กรุณาใส่จำนวนเงินอย่างน้อย 1 กอง');
      const noNav = lines.find(l => l.nav === 0);
      if (noNav) throw new Error('กรุณาใส่ NAV ที่ซื้อของ ' + noNav.fund);
      await api('saveContribution', { BatchID: first ? first.BatchID : '', date: f.date, account: f.account, note: f.note, lines, sourceFund: f.sourceFund || '' });
      toast('บันทึกแล้ว'); refresh();
    },
  });
}

function snapshotModal(d) {
  const month = thisMonth();
  const funds = d.funds.filter(f => f.Active);
  openModal({
    title: 'อัปเดตยอด / NAV',
    wide: true,
    body: '<div class="form-grid" style="margin-bottom:12px">' + field('เดือน', '<input type="month" name="month" value="' + month + '">') + '</div>' +
      '<table class="data lines-table"><thead><tr><th>กอง</th><th>ยอดปัจจุบัน / NAV ล่าสุด</th><th>อัตราแลกเปลี่ยน</th><th class="num">มูลค่า (บาท)</th></tr></thead><tbody>' +
      funds.map(f => {
        const isFund = isUnitKind(f.Kind);
        return '<tr data-fund="' + esc(f.Name) + '" data-units="' + (f.units || 0) + '"><td>' + esc(f.Name) + ' <span class="badge">' + esc(f.Kind || f.Currency) + '</span>' +
          (isFund ? '<div class="small muted">' + fmt(f.units, 4) + ' หน่วย</div>' : '') + '</td>' +
          '<td>' + (isFund ? '<input type="number" step="0.0001" class="s-nav" value="' + (f.nav || '') + '" placeholder="NAV" style="text-align:right">'
            : '<input type="number" step="0.01" class="s-val" value="' + f.valueFX + '" style="text-align:right">') + '</td>' +
          '<td>' + (f.Currency === 'USD' ? '<input type="number" step="0.0001" class="s-rate" value="' + d.usdRate + '" style="text-align:right">' : '<span class="muted">-</span>') + '</td>' +
          '<td class="num s-thb"></td></tr>';
      }).join('') +
      '</tbody></table><p class="muted small">กองทุนรวม: ใส่ NAV ล่าสุดจากแอปลงทุน ระบบคำนวณมูลค่า = หน่วย × NAV · อื่นๆ: ใส่ยอดตามที่เห็นในแอปธนาคาร · บันทึกเดือนเดิมซ้ำจะแทนที่ของเดิม</p>',
    onOpen: root => {
      const recalc = () => $$('tr[data-fund]', root).forEach(tr => {
        const nav = $('.s-nav', tr), r = $('.s-rate', tr);
        const v = nav ? num(tr.dataset.units) * num(nav.value) : num($('.s-val', tr).value) * (r ? num(r.value) : 1);
        $('.s-thb', tr).textContent = money(v);
      });
      root.addEventListener('input', recalc); recalc();
    },
    onSubmit: async form => {
      const f = readForm(form);
      const items = $$('tr[data-fund]', form).map(tr => {
        const nav = $('.s-nav', tr);
        if (nav) return nav.value === '' ? null : { fund: tr.dataset.fund, nav: num(nav.value) };
        const v = $('.s-val', tr);
        return v.value === '' ? null : { fund: tr.dataset.fund, valueFX: num(v.value), rate: $('.s-rate', tr) ? num($('.s-rate', tr).value) : 1 };
      }).filter(Boolean);
      await api('saveSnapshots', { month: f.month, items });
      toast('อัปเดตแล้ว'); refresh();
    },
  });
}

/** ดึงเงินออกจากกองมาใช้ (ค่าเริ่มต้น: กองเงินฉุกเฉินที่มียอดมากที่สุด) */
function withdrawModal(d, pre) {
  const funds = d.funds.filter(f => f.Active && f.valueTHB > 0);
  if (!funds.length) return toast('ยังไม่มีกองที่มียอดเงิน', true);
  const em = funds.filter(f => f.Goal === 'ฉุกเฉิน').sort((a, b) => b.valueTHB - a.valueTHB)[0] || funds[0];
  const sel = pre.fund || em.Name;
  openModal({
    title: pre.fund ? 'ขาย / ถอนจาก ' + pre.fund : 'ดึงเงินออกมาใช้',
    body: '<div class="form-grid">' +
      field('ดึงจากกอง', '<select name="fund">' + funds.map(f => '<option value="' + esc(f.Name) + '"' + (f.Name === sel ? ' selected' : '') + '>' + esc(f.Name) + ' (' + money(f.valueTHB) + ')</option>').join('') + '</select>', 'full') +
      field('วันที่', '<input type="date" name="date" value="' + (pre.date || today()) + '">') +
      field('จำนวนเงิน (บาท)', '<input type="number" step="0.01" name="amountTHB" value="' + (pre.amount ? Math.ceil(pre.amount) : '') + '">') +
      field('อัตราแลกเปลี่ยน', '<input type="number" step="0.0001" name="rate" value="' + d.usdRate + '">', 'w-rate') +
      field('NAV ที่ขาย', '<input type="number" step="0.0001" name="nav">', 'w-nav') +
      field('โอนเข้าบัญชี', '<select name="account">' + opts(accounts(), '', true) + '</select>') +
      field('ใช้ทำอะไร', '<input name="note" placeholder="เช่น ค่ารักษาพยาบาล, เงินไม่พอเดือนนี้">') +
      field('เงินที่ได้', '<select name="dest"><option value="">นำออกมาใช้ (หักจากเงินออมของเดือน)</option>' +
        d.funds.filter(f => f.Active && !isUnitKind(f.Kind)).map(f => '<option value="' + esc(f.Name) + '">เก็บเข้ากอง ' + esc(f.Name) + ' (ย้ายระหว่างกอง)</option>').join('') + '</select>', 'full') +
      '<label class="full w-refill"><input type="checkbox" name="refill" checked> ต้องเติมคืนกองนี้ภายหลัง</label>' +
      '<div class="full muted small" id="w-info"></div></div>',
    onOpen: root => {
      const sync = () => {
        const f = funds.find(x => x.Name === $('select[name=fund]', root).value);
        $('.w-rate', root).classList.toggle('hidden', f.Currency !== 'USD');
        $('.w-nav', root).classList.toggle('hidden', !isUnitKind(f.Kind));
        const navIn = $('input[name=nav]', root);
        if (isUnitKind(f.Kind) && !navIn.value) navIn.value = f.nav || '';
        const amt = num($('input[name=amountTHB]', root).value);
        const destSel = $('select[name=dest]', root);
        Array.from(destSel.options).forEach(o => { o.disabled = o.value === f.Name; });
        if (destSel.value === f.Name) destSel.value = '';
        $('.w-refill', root).classList.toggle('hidden', !!destSel.value);
        $('#w-info', root).innerHTML = 'ยอดในกอง ' + money(f.valueTHB) + (amt ? ' → เหลือ ' + money(f.valueTHB - amt) : '') +
          (isUnitKind(f.Kind) && amt && num(navIn.value) ? ' · ขาย ' + fmt(amt / num(navIn.value), 4) + ' ' + unitWord(f.Kind) : '') +
          '<br>ในสรุปเดือนนี้จะหักออกจากเงินออม (ไม่นับเป็นรายรับ)';
      };
      root.addEventListener('input', sync); root.addEventListener('change', sync); sync();
    },
    onSubmit: async form => {
      const f = readForm(form);
      if (!num(f.amountTHB)) throw new Error('กรุณาใส่จำนวนเงิน');
      if (f.dest) {
        await api('saveContribution', { date: f.date, account: f.account, note: f.note || ('ขาย/ย้ายจาก ' + f.fund), sourceFund: f.fund, sourceNav: num(f.nav),
          lines: [{ fund: f.dest, amountTHB: num(f.amountTHB), rate: num(f.rate) || S.usdRate }] });
        toast('ย้ายเงินเข้ากอง ' + f.dest + ' แล้ว'); refresh(); return;
      }
      await api('withdraw', { fund: f.fund, date: f.date, amountTHB: num(f.amountTHB), rate: num(f.rate), nav: num(f.nav), account: f.account, note: f.note, refill: f.refill });
      toast('บันทึกการดึงเงินแล้ว'); refresh();
    },
  });
}

/** รับเงินปันผล: รายรับ + ซื้อเพิ่ม/เก็บเข้ากองเงินสด ในครั้งเดียว */
function dividendModal(d) {
  const stocks = d.funds.filter(f => f.Active && isUnitKind(f.Kind));
  if (!stocks.length) return toast('ยังไม่มีหุ้น/กองทุนในหน้าลงทุน', true);
  const cashFunds = d.funds.filter(f => f.Active && !isUnitKind(f.Kind));
  const lastCash = (() => { try { return localStorage.getItem('divCashFund') || ''; } catch (e) { return ''; } })();
  openModal({
    title: 'รับเงินปันผล',
    body: '<div class="form-grid">' +
      field('หุ้นที่จ่ายปันผล', '<select name="fund">' + stocks.map(f => '<option value="' + esc(f.Name) + '" data-usd="' + (f.priceCurrency === 'USD' ? 1 : 0) + '" data-price="' + (f.nav || '') + '">' + esc(f.Name) + (f.ticker ? ' (' + esc(f.ticker) + ')' : '') + '</option>').join('') + '</select>', 'full') +
      field('วันที่ได้รับ', '<input type="date" name="date" value="' + today() + '">') +
      field('บัญชีที่เข้า', '<select name="account">' + opts(accounts(), '', true) + '</select>') +
      field('ยอดที่ได้รับ (USD, หลังหักภาษี)', '<input type="number" step="0.01" name="amountUSD">', 'd-usd') +
      field('อัตราแลกเปลี่ยน', '<input type="number" step="0.0001" name="rate" value="' + d.usdRate + '">', 'd-usd') +
      field('ยอดที่ได้รับ (บาท)', '<input type="number" step="0.01" name="amountTHB" placeholder="คำนวณจาก USD ให้ หรือใส่เอง">') +
      '<div></div>' +
      '<div class="full"><span class="small muted">เงินปันผลนี้</span><div class="seg" style="margin-top:4px;display:flex;flex-wrap:wrap">' +
      '<label><input type="radio" name="mode" value="cash"' + (cashFunds.length ? ' checked' : '') + '>เก็บรวมไว้ในกองเงินสด</label>' +
      '<label><input type="radio" name="mode" value="reinvest"' + (cashFunds.length ? '' : ' checked') + '>ซื้อหุ้นตัวนี้เพิ่มทันที</label>' +
      '<label><input type="radio" name="mode" value="none">บันทึกรายรับอย่างเดียว</label></div></div>' +
      field('เก็บเข้ากอง', '<select name="cashFund">' + cashFunds.map(f => '<option value="' + esc(f.Name) + '"' + (f.Name === lastCash ? ' selected' : '') + '>' + esc(f.Name) + ' (' + money(f.valueTHB) + ')</option>').join('') + '</select>', 'full d-cash') +
      field('ราคาที่ซื้อ (บาท/หุ้น)', '<input type="number" step="0.0001" name="price">', 'full d-re') +
      field('หมายเหตุ', '<input name="note" placeholder="เช่น ปันผล ต.ค.">', 'full') +
      '<div class="full muted small" id="d-info"></div></div>',
    onOpen: root => {
      const sync = () => {
        const sel = $('select[name=fund]', root).selectedOptions[0];
        const usd = sel.dataset.usd === '1';
        $$('.d-usd', root).forEach(x => x.classList.toggle('hidden', !usd));
        const mode = readForm(root).mode;
        $('.d-cash', root).classList.toggle('hidden', mode !== 'cash');
        $('.d-re', root).classList.toggle('hidden', mode !== 'reinvest');
        const priceIn = $('input[name=price]', root);
        if (!priceIn.value) priceIn.value = sel.dataset.price || '';
        const f = readForm(root);
        const thbIn = $('input[name=amountTHB]', root);
        if (usd && num(f.amountUSD) && document.activeElement !== thbIn) thbIn.value = Math.round(num(f.amountUSD) * num(f.rate) * 100) / 100;
        const thb = num(thbIn.value);
        const cat = usd ? 'เงินปันผลต่างประเทศ (ไม่นับภาษีอัตโนมัติ)' : 'เงินปันผล';
        $('#d-info', root).innerHTML = thb ? 'บันทึกรายรับ ' + money(thb) + ' หมวด ' + cat +
          (mode === 'cash' ? ' แล้วเก็บเข้ากอง ' + esc(f.cashFund || '-') : mode === 'reinvest' && num(f.price) ? ' แล้วซื้อเพิ่ม ' + fmt(thb / num(f.price), 4) + ' หุ้น' : '') : '';
      };
      root.addEventListener('input', sync); root.addEventListener('change', sync); sync();
    },
    onSubmit: async form => {
      const f = readForm(form);
      if (f.mode === 'cash' && !f.cashFund) throw new Error('ยังไม่มีกองเงินสด — เพิ่มในหน้าตั้งค่า หรือเลือกโหมดอื่น');
      if (f.mode === 'cash') { try { localStorage.setItem('divCashFund', f.cashFund); } catch (e) { /* ไม่เป็นไร */ } }
      const r = await api('receiveDividend', { fund: f.fund, date: f.date, account: f.account, amountUSD: num(f.amountUSD), rate: num(f.rate), amountTHB: num(f.amountTHB),
        mode: f.mode, cashFund: f.cashFund, price: num(f.price), note: f.note });
      S.txCache = {};
      toast('บันทึกเงินปันผล ' + money(r.amountTHB) + ' แล้ว'); refresh();
    },
  });
}

const TAX_DED = [
  ['Ded_Expense', 'ค่าใช้จ่าย (เว้นว่าง = 50% ไม่เกิน 100,000 อัตโนมัติ)'],
  ['Ded_Personal', 'ลดหย่อนส่วนตัว'],
  ['Ded_Family', 'ลดหย่อนบิดามารดา/ครอบครัว'],
  ['Ded_Insurance', 'เบี้ยประกันชีวิต/สุขภาพ'],
  ['Ded_SocialSecurity', 'ประกันสังคม'],
  ['Ded_Fund', 'กองทุน (SSF/RMF/PVD/ThaiESG)'],
  ['Ded_Property', 'ดอกเบี้ยบ้าน/อสังหา'],
  ['Ded_Other', 'อื่นๆ (เช่น Easy e-Receipt, บริจาค)'],
];

function calcTax(row, autoIncome, brackets) {
  const v = k => (isBlank(row[k]) ? null : num(row[k]));
  const income = v('IncomeOverride') !== null ? v('IncomeOverride') : autoIncome;
  const dedExpense = v('Ded_Expense') !== null ? v('Ded_Expense') : Math.min(income * 0.5, 100000);
  const deds = TAX_DED.map(d => ({ key: d[0], label: d[1], value: d[0] === 'Ded_Expense' ? dedExpense : (v(d[0]) || 0) }));
  const totalDed = deds.reduce((s, d) => s + d.value, 0);
  const net = Math.max(0, income - totalDed);
  const steps = [];
  let tax = 0;
  brackets.forEach(b => {
    const upper = isBlank(b.Max) ? Infinity : num(b.Max);
    if (net <= b.Min) return;
    const part = Math.min(net, upper) - b.Min;
    const t = part * b.Rate / 100;
    tax += t;
    steps.push({ range: fmt(b.Min, 0) + ' – ' + (upper === Infinity ? 'ขึ้นไป' : fmt(upper, 0)), rate: b.Rate, part, tax: t });
  });
  const finalTax = v('TaxOverride') !== null ? v('TaxOverride') : tax;
  const withheld = v('Withheld') || 0;
  return { income, deds, totalDed, net, steps, tax, finalTax, withheld, diff: finalTax - withheld };
}

function rangeText(i) {
  if (!isBlank(i.Min) && !isBlank(i.Max)) return fmt(i.Min) + ' – ' + fmt(i.Max);
  if (!isBlank(i.Min)) return '≥ ' + fmt(i.Min);
  if (!isBlank(i.Max)) return '≤ ' + fmt(i.Max);
  return '';
}
function rangeClass(i, v) {
  if (isBlank(v)) return '';
  const n = parseFloat(v);
  if (!isFinite(n)) return '';
  if (!isBlank(i.Max) && n > num(i.Max)) return 'cell-high';
  if (!isBlank(i.Min) && n < num(i.Min)) return 'cell-low';
  return '';
}

      return g + '<tr><td><a data-chart="' + esc(i.Name) + '" style="cursor:pointer">' + esc(i.Name) + '</a> <span class="muted small">' + esc(i.Unit) + '</span></td><td class="muted small">' + rangeText(i) + '</td>' +
        visits.map(v => { const val = v.values[i.Name]; return '<td class="num ' + rangeClass(i, val) + '">' + (isBlank(val) ? '<span class="muted">-</span>' : esc(val)) + '</td>'; }).join('') + '</tr>';

function renderGrid(s, rows) {
  const body = $('#set-' + s.key + ' .grid-body');
  body.classList.remove('loading');
  body.innerHTML = '<div class="table-wrap" style="max-height:420px"><table class="data grid-editor"><thead><tr>' + s.cols.map(c => '<th>' + c.l + '</th>').join('') + (s.fixed ? '' : '<th></th>') + '</tr></thead><tbody>' +
    rows.map((r, idx) => '<tr data-idx="' + idx + '">' + s.cols.map(c => {
      const v = r[c.k];
      let input;
      if (c.t === 'check') input = '<input type="checkbox" data-k="' + c.k + '"' + (truthy(v) ? ' checked' : '') + '>';
      else if (c.t === 'select') input = '<select data-k="' + c.k + '">' + opts(c.o(), v, true) + '</select>';
      else if (c.t === 'ro') input = '<span data-k="' + c.k + '" data-v="' + esc(v) + '" class="small">' + esc(v) + '</span>';
      else input = '<input data-k="' + c.k + '"' + (c.t === 'number' ? ' type="number" step="any"' : '') + ' value="' + esc(v) + '">';
      return '<td' + (c.t === 'check' ? ' style="text-align:center;width:60px"' : '') + '>' + input + '</td>';
    }).join('') + (s.fixed ? '' : '<td style="width:36px"><button class="icon-btn" data-delrow title="ลบแถว">✕</button></td>') + '</tr>').join('') +
    '</tbody></table></div>';
  $$('[data-delrow]', body).forEach(b => b.addEventListener('click', () => {
    const rowsNow = gridRows(s);
    rowsNow.splice(+b.closest('tr').dataset.idx, 1);
    renderGrid(s, rowsNow);
  }));
}

function gridRows(s) {
  return $$('#set-' + s.key + ' tbody tr').map(tr => {
    const o = {};
    s.cols.forEach(c => {
      const el = $('[data-k="' + c.k + '"]', tr);
      if (!el) return;
      if (c.t === 'check') o[c.k] = el.checked;
      else if (c.t === 'ro') o[c.k] = el.dataset.v;
      else if (c.t === 'number') o[c.k] = el.value === '' ? '' : Number(el.value);
      else o[c.k] = el.value;
    });
    return o;
  });
}

PAGES.plan = async token => {
  const tab = S.planTab || 'month';
  const tabs = '<div class="tabs">' + [['month', 'แผนรายเดือน'], ['compare', 'แผน vs จริง'], ['long', 'คาดการณ์ถึงเกษียณ'], ['inst', 'แผนผ่อน']]

  const body = tab === 'month' ? await planMonthHtml() : tab === 'compare' ? await planCompareHtml() : tab === 'long' ? await planLongHtml() : await instHtml();

};

        toast(await api('importPlan')); refresh();

        planItemModal({ ID: r.itemId, Type: r.type, Category: r.category, Name: r.item, DefaultAmount: r.cells[0].def });
      }));
      $$('.pl-cell').forEach(inp => {
        inp.addEventListener('focus', () => inp.select());
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
        // ลบตัวเลข = 0 (เดือนนี้ไม่มีรายการนี้) · กลับไปใช้ค่าตั้งต้นด้วยปุ่ม ↺
        const setCell = async reset => {
          const r = S.planData.rows[+inp.dataset.r], c = r.cells[+inp.dataset.c];
          const v = reset ? c.def : num(inp.value.trim() || 0);
          c.own = !reset; c.v = v; if (reset) c.src = '';
          inp.value = reset ? (c.def || '') : v;
          inp.classList.toggle('own', c.own);
          inp.classList.toggle('zero', c.own && !v && !!c.def);
          planRecalc();
          try { await api('savePlanCell', S.planData.months[+inp.dataset.c], r.type, r.category, reset ? '' : v, r.item || ''); }
          catch (e) { toast(errMsg(e), true); }
        };
        inp.addEventListener('change', () => setCell(false));
        inp.parentNode.querySelector('.pl-undo').addEventListener('click', () => setCell(true));
      });
      planRecalc();
    },
  };
}

function planMonthRerender() { clearApiCache(); refresh(); }

/** คำนวณยอดรวม/คงเหลือ/เตือน/กราฟ ในหน้าแผน (ไม่ต้องโหลดใหม่) */
function planRecalc() {
  const p = S.planData;
  // เงินออมที่ยังไม่แก้เอง = % ของรายรับ
  // แถวหมวดที่มีรายการย่อย = ผลรวมรายการย่อย
  p.rows.filter(r => r.hasItems).forEach(r => {
    const subs = p.rows.filter(x => x.sub && x.type === r.type && x.category === r.category);
    r.cells.forEach((c, j) => { c.v = subs.reduce((a, x) => a + x.cells[j].v, 0); });
  });
  const sumType = (type, j) => p.rows.filter(r => r.type === type && !r.sub).reduce((a, r) => a + r.cells[j].v, 0);
  const savingRow = p.rows.find(r => r.type === PLAN_SAVING_TYPE && !r.sub);
  if (!savingRow.hasItems) p.months.forEach((m, j) => {
    const c = savingRow.cells[j];
    c.def = Math.round(sumType(INCOME, j) * p.savingPct) / 100;
    if (!c.own) c.v = c.def;
  });
  $$('.pl-sum').forEach(sp => { const v = p.rows[+sp.dataset.r].cells[+sp.dataset.c].v; sp.textContent = v ? fmt(v, 0) : '-'; });
  $$('.pl-cell').forEach(inp => {
    const r = p.rows[+inp.dataset.r];
    if (r.type !== PLAN_SAVING_TYPE || r.sub) return;
    const c = r.cells[+inp.dataset.c];
    if (!c.own && document.activeElement !== inp) inp.value = c.v ? Math.round(c.v * 100) / 100 : '';
    inp.placeholder = fmt(c.def, 0);
  });
  const tot = p.months.map((m, j) => {
    const income = sumType(INCOME, j), expense = sumType(EXPENSE, j), saving = sumType(PLAN_SAVING_TYPE, j), withdraw = sumType(PLAN_WITHDRAW_TYPE, j);
    return { month: m, idx: j, income, expense, saving, withdraw, remaining: income - expense - saving + withdraw };
  });
  $$('.pl-tot').forEach(td => {
    const k = td.dataset.k;
    const v = td.dataset.c === 'all' ? tot.reduce((a, t) => a + t[k], 0) : tot[+td.dataset.c][k];
    td.textContent = fmt(v, 0);
    td.className = 'num pl-tot' + (k === 'remaining' && v < 0 ? ' expense' : '');
  });
  $$('.pl-rowsum').forEach(td => { td.textContent = fmt(p.rows[+td.dataset.r].cells.reduce((a, c) => a + c.v, 0), 0); });
  const neg = tot.filter(t => t.remaining < 0);
  const box = $('#pl-alert');
  box.innerHTML = neg.length
    ? '<b class="expense">⚠️ เงินไม่พอ ' + neg.length + ' เดือน:</b> ' + neg.map(t => monthLabel(t.month) + ' ขาด ฿' + fmt(-t.remaining, 0)).join(' · ') +
      '<div class="toolbar" style="margin-top:8px"><button type="button" class="btn sm primary" id="pl-fill-all">ดึงเงินออมมาเติมทุกเดือนที่ขาด</button>' +
      '<span class="small muted">หรือลดรายจ่าย/เงินออมของเดือนนั้น (รวมทุกเดือน คงเหลือ ฿' + fmt(tot.reduce((a, t) => a + t.remaining, 0), 0) + ')</span></div>'
    : '<b class="income">✓ ทุกเดือนในแผนมีเงินพอ</b> <span class="muted small">คงเหลือรวม ' + money(tot.reduce((a, t) => a + t.remaining, 0)) + '</span>';
  box.style.borderColor = neg.length ? 'var(--bad)' : '';
  const fillBtn = $('#pl-fill-all');
  if (fillBtn) fillBtn.addEventListener('click', async () => {
    const wr = p.rows.find(r => r.type === PLAN_WITHDRAW_TYPE);
    fillBtn.disabled = true;
    try {
      for (const t of neg) {
        const c = wr.cells[t.idx];
        c.v = Math.ceil(c.v - t.remaining); c.own = true;
        await api('savePlanCell', t.month, PLAN_WITHDRAW_TYPE, wr.category, c.v, '');
      }
      toast('ใส่ยอดดึงจากเงินออมแล้ว ' + neg.length + ' เดือน · ตอนดึงจริงให้กด "ดึงเงินออกมาใช้" ในหน้าเงินออม/ลงทุน');
      planMonthRerender();
    } catch (e) { toast(errMsg(e), true); fillBtn.disabled = false; }
  });
  chart('ch-plan', {
    type: 'bar',
    data: {
      labels: tot.map(t => monthLabel(t.month)),
      datasets: [
        { type: 'bar', label: 'รายรับ', data: tot.map(t => t.income), backgroundColor: cssVar('--income') },
        { type: 'bar', label: 'รายจ่าย', data: tot.map(t => t.expense), backgroundColor: cssVar('--expense') },
        { type: 'bar', label: 'เงินออม', data: tot.map(t => t.saving), backgroundColor: cssVar('--saving') },
        { type: 'line', label: 'คงเหลือ', data: tot.map(t => t.remaining), borderColor: cssVar('--text'), backgroundColor: cssVar('--text'), tension: .2 },
      ],
    },
    options: { maintainAspectRatio: false, animation: false, scales: { y: { ticks: moneyTick } }, plugins: { tooltip: moneyTooltip } },
  });
}

async function planCompareHtml() {
  const period = S.pvPeriod || thisMonth();
  const d = await api('planVsActual', period);
  const isYear = period.length === 4;
  const toolbar = '<select id="pv-mode">' + opts([{ value: 'm', label: 'รายเดือน' }, { value: 'y', label: 'ทั้งปี (ถึงเดือนนี้)' }], isYear ? 'y' : 'm') + '</select>' +
    (isYear ? '<select id="pv-year">' + yearOptions(+period) + '</select>' : '<input type="month" id="pv-month" value="' + period + '">');
  const groups = [[INCOME, 'รายรับ', 'income', true], [EXPENSE, 'รายจ่าย', 'expense', false], [PLAN_SAVING_TYPE, 'เงินออม/ลงทุน', 'saving', true], [PLAN_WITHDRAW_TYPE, 'ดึงเงินออมมาใช้', 'expense', false]];
  let body = '';
  groups.forEach(g => {
    const rows = d.rows.filter(r => r.type === g[0]);
    if (!rows.length) return;
    const tp = rows.reduce((a, r) => a + r.plan, 0), ta = rows.reduce((a, r) => a + r.actual, 0);
    body += '<tr><td colspan="5"><b class="' + g[2] + '">' + g[1] + '</b></td></tr>' + rows.map(r => {
      const good = g[3] ? r.diff >= 0 : r.diff <= 0;
      const pct = r.plan ? r.actual / r.plan * 100 : 0;
      const line = (label, x, cls) => {
        const gd = g[3] ? x.diff >= 0 : x.diff <= 0;
        const pc = x.plan ? x.actual / x.plan * 100 : 0;
        return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td class="num">' + fmt(x.plan) + '</td><td class="num">' + fmt(x.actual) + '</td><td class="num ' + (x.diff ? (gd ? 'income' : 'expense') : 'muted') + '">' +
          (x.diff > 0 ? '+' : x.diff < 0 ? '−' : '') + fmt(Math.abs(x.diff)) + '</td><td style="width:180px">' + (x.plan ? barHtml(pc, g[3] ? (pc >= 100 ? 'ok' : 'warn') : (pc > 100 ? 'bad' : pc >= 80 ? 'warn' : 'ok')) + '<span class="small muted">' + fmt(pc, 0) + '%</span>' : (x.unassigned ? '<span class="badge">ไม่ระบุรายการย่อย</span>' : '<span class="badge warn">นอกแผน</span>')) + '</td></tr>';
      };
      return line('&nbsp;&nbsp;' + esc(r.category), r) +
        (r.items || []).map(i => line('&nbsp;&nbsp;&nbsp;&nbsp;<span class="muted">↳ ' + (i.unassigned ? 'ไม่ระบุ' : esc(i.item)) + '</span>', i, 'pv-item')).join('');
    }).join('') + '<tr><td><b>รวม' + g[1] + '</b></td><td class="num"><b>' + fmt(tp) + '</b></td><td class="num"><b>' + fmt(ta) + '</b></td><td class="num"><b>' + (ta - tp >= 0 ? '+' : '−') + fmt(Math.abs(ta - tp)) + '</b></td><td></td></tr>';
  });
  const html = '<div class="panel"><p class="muted small" style="margin-top:0">' + (isYear ? 'รวม ' + d.months.length + ' เดือน (' + monthLabel(d.months[0]) + ' – ' + monthLabel(d.months[d.months.length - 1]) + ')' : monthLabel(period)) +
    ' · รายจ่าย: ใช้น้อยกว่าแผน = สีเขียว · รายรับ/เงินออม: ได้มากกว่าแผน = สีเขียว</p>' +
    '<table class="data"><thead><tr><th>หมวด</th><th class="num">แผน</th><th class="num">จริง</th><th class="num">ต่าง</th><th>% ของแผน</th></tr></thead><tbody>' +
    (body || '<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>') + '</tbody></table></div>';
  return {
    toolbar, html,
    bind: () => {
      $('#pv-mode').addEventListener('change', e => { S.pvPeriod = e.target.value === 'y' ? String(thisYear()) : thisMonth(); refresh(); });
      const m = $('#pv-month'); if (m) m.addEventListener('change', e => { S.pvPeriod = e.target.value; refresh(); });
      const y = $('#pv-year'); if (y) y.addEventListener('change', e => { S.pvPeriod = e.target.value; refresh(); });
    },
  };
}

function instModal(i) {
  const isNew = !i;
  i = i || { Name: '', Total: '', Months: 10, StartMonth: thisMonth(), Monthly: '', Category: 'หนี้สิน/ผ่อน', Account: '', DayOfMonth: 25, Note: '' };
  openModal({
    title: isNew ? 'เพิ่มแผนผ่อน' : 'แก้ไขแผนผ่อน',
    body: '<div class="form-grid">' +
      field('ซื้ออะไร', '<input name="Name" value="' + esc(i.Name) + '" placeholder="เช่น คอมพิวเตอร์">', 'full') +
      field('ราคารวม (บาท)', '<input type="number" step="0.01" name="Total" value="' + esc(i.Total) + '">') +
      field('จำนวนงวด (เดือน)', '<input type="number" min="1" name="Months" value="' + esc(i.Months) + '">') +
      field('เดือนเริ่มผ่อน', '<input type="month" name="StartMonth" value="' + esc(i.StartMonth) + '">') +
      field('ค่างวด/เดือน (เว้นว่าง = ราคา ÷ งวด)', '<input type="number" step="0.01" name="Monthly" value="' + esc(isNew ? '' : i.Monthly) + '">') +
      field('หมวด', '<select name="Category">' + opts(cats(EXPENSE, i.Category), i.Category, true) + '</select>') +
      field('จ่ายด้วยบัญชี/บัตร', '<select name="Account">' + opts(accounts(i.Account), i.Account, true) + '</select>') +
      field('วันตัดบัตร/วันจ่าย', '<input type="number" min="1" max="31" name="DayOfMonth" value="' + esc(i.DayOfMonth) + '">') +
      field('หมายเหตุ', '<input name="Note" value="' + esc(i.Note) + '">') +
      '<div class="full muted" id="inst-sum"></div></div>',
    onOpen: root => {
      const recalc = () => {
        const f = readForm(root);
        const n = Math.max(1, num(f.Months)), m = num(f.Monthly) || num(f.Total) / n;
        let end = '';
        if (f.StartMonth) { const d = new Date(+f.StartMonth.slice(0, 4), +f.StartMonth.slice(5, 7) - 1 + n - 1, 1); end = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
        $('#inst-sum', root).textContent = 'งวดละ ' + money(m) + ' × ' + n + ' งวด' + (end ? ' · ผ่อนถึง ' + monthLabel(end) : '');
      };
      root.addEventListener('input', recalc); recalc();
    },
    onSubmit: async form => {
      const f = readForm(form);
      if (!num(f.Total)) throw new Error('กรุณาใส่ราคารวม');
      await api('saveInstallment', Object.assign({ ID: i.ID }, f, { Total: num(f.Total), Months: num(f.Months), Monthly: num(f.Monthly), DayOfMonth: num(f.DayOfMonth) }));
      toast('บันทึกแล้ว'); refresh();
    },
  });
}

async function instHtml() {

  const list = await api('installments', month);
  const active = list.filter(i => !i.done);
  const due = list.filter(i => i.dueThisMonth);
  const toolbar = '<button class="btn primary" id="inst-add">+ เพิ่มแผนผ่อน</button>';
  const html = '<div class="grid cards">' + cardHtml('ยอดผ่อนคงเหลือ', money(active.reduce((a, i) => a + i.remaining, 0)), 'expense', active.length + ' รายการ') +
    cardHtml('ค่างวดต่อเดือน (ตอนนี้)', money(list.filter(i => !i.done && month >= i.StartMonth && month <= i.EndMonth).reduce((a, i) => a + i.Monthly, 0))) +
    cardHtml('ต้องบันทึกเดือนนี้', due.length + ' งวด', due.length ? 'expense' : 'income') + '</div>' +
    '<div class="panel"><div class="toolbar" style="margin-bottom:10px"><span style="flex:1"></span>' + (due.length ? '<button class="btn primary sm" id="inst-post">บันทึกงวดเดือนนี้ (' + due.length + ')</button>' : '') + '</div>' +
    '<table class="data"><thead><tr><th>รายการ</th><th>หมวด / บัญชี</th><th class="num">ราคา</th><th class="num">งวดละ</th><th>ช่วงผ่อน</th><th style="width:200px">ความคืบหน้า</th><th class="num">คงเหลือ</th><th></th></tr></thead><tbody>' +
    (list.length ? list.map(i => '<tr' + (i.done ? ' class="muted"' : '') + '><td>' + esc(i.Name) + (i.dueThisMonth ? ' <span class="badge warn">ยังไม่บันทึกงวดเดือนนี้</span>' : '') + (i.done ? ' <span class="badge ok">ผ่อนครบ</span>' : '') +
      '</td><td>' + esc(i.Category) + '<div class="small muted">' + esc(i.Account) + '</div></td><td class="num">' + fmt(i.Total) + '</td><td class="num">' + fmt(i.Monthly) + '</td><td>' + monthLabel(i.StartMonth) + ' – ' + monthLabel(i.EndMonth) +
      '</td><td>' + barHtml(i.paidCount / i.Months * 100, i.done ? 'ok' : '') + '<span class="small muted">' + i.paidCount + '/' + i.Months + ' งวด · จ่ายแล้ว ' + fmt(i.paidAmount) + '</span></td><td class="num"><b>' + fmt(i.remaining) +
      '</b></td><td style="white-space:nowrap"><button class="icon-btn" data-iedit="' + esc(i.ID) + '">✏️</button><button class="icon-btn" data-idel="' + esc(i.ID) + '">🗑</button></td></tr>').join('')
      : '<tr><td colspan="8" class="empty">ยังไม่มีแผนผ่อน — กด "เพิ่มแผนผ่อน" เมื่อซื้อของชิ้นใหญ่</td></tr>') + '</tbody></table>' +
    '<p class="muted small">งวดผ่อนจะขึ้นในแผนรายเดือนอัตโนมัติ และขึ้นเตือนในหน้าภาพรวมทุกเดือนจนกว่าจะผ่อนครบ (กดบันทึกแล้วจะเป็นรายจ่ายจริงในหมวดที่เลือก)</p></div>';
  return {
    toolbar, html,
    bind: () => {
      $('#inst-add').addEventListener('click', () => instModal(null));
      const post = $('#inst-post');
      if (post) post.addEventListener('click', async () => {
        try { const n = await api('postInstallments', due.map(i => i.ID), month); S.txCache = {}; toast('บันทึกแล้ว ' + n + ' งวด'); refresh(); } catch (e) { toast(errMsg(e), true); }
      });
      $$('[data-iedit]').forEach(b => b.addEventListener('click', () => instModal(list.find(i => i.ID === b.dataset.iedit))));
      $$('[data-idel]').forEach(b => b.addEventListener('click', () => confirmAction('ลบแผนผ่อนนี้? (งวดที่บันทึกเป็นรายจ่ายไปแล้วไม่ถูกลบ)', async () => {
        await api('deleteInstallment', b.dataset.idel); toast('ลบแล้ว'); refresh();
      })));
    },
  };
}

/** เตือนเมื่อหน้าเว็บนี้รันโค้ดเก่ากว่าโค้ดในโปรเจกต์ (เช่น เปิดลิงก์ /exec ที่ยังไม่ได้ Deploy เวอร์ชันใหม่) */
function staleVersionWarning() {
  const b = S.boot;
  if (!b || !b.runningVersion || b.runningVersion === 'dev' || !b.codeVersion || b.runningVersion === b.codeVersion) return;
  const bar = document.createElement('div');
  bar.className = 'stale-bar';
  bar.innerHTML = '⚠️ หน้านี้ใช้โค้ดเวอร์ชันเก่า <b>' + esc(b.runningVersion) + '</b> แต่โค้ดล่าสุดในโปรเจกต์คือ <b>' + esc(b.codeVersion) + '</b> — ' +
    'ลิงก์นี้ผูกกับการ Deploy ครั้งก่อน · ใช้ลิงก์จาก <b>การทำให้ใช้งานได้ → ทดสอบการทำให้ใช้งานได้</b> (ลงท้าย <code>/dev</code>) ' +
    'หรือ <b>จัดการการทำให้ใช้งานได้ → ✏️ → เวอร์ชันใหม่</b>';
  document.body.prepend(bar);
}

/** โหลดข้อมูลหน้าอื่นล่วงหน้า (ทำพร้อมกันเบื้องหลัง) เพื่อให้กดเปลี่ยนหน้าแล้วแสดงทันที */
function prefetch() {
  const y = thisYear(), m = thisMonth();
  S.inPrefetch = true;
  S.txCache[y] || api('transactions', y).then(r => { S.txCache[y] = S.txCache[y] || r; }).catch(() => {});
  [['plan', m, 12], ['loans'], ['invest'], ['planVsActual', m], ['health'], ['tax', y], ['recurring', m], ['installments', m]]
    .forEach(a => api.apply(null, a).catch(() => {}));
  S.inPrefetch = false;
}

/* ---------- เริ่มต้น ---------- */
(async function init() {
  try {
    const first = await apiRaw('init', ['']);
    S.boot = first.boot;
    API_CACHE['dashboard' + JSON.stringify([first.dashboard.month])] = { t: Date.now(), v: JSON.stringify(first.dashboard) };
    go('dashboard');
    staleVersionWarning();
    S.pageLoad = performance.now();
    renderVer();
    setTimeout(prefetch, 300);
  } catch (e) {
    $('#main').innerHTML = '<div class="panel"><h2>เริ่มต้นไม่สำเร็จ</h2><p class="error">' + esc(errMsg(e)) + '</p>' +
      '<p>ถ้ายังไม่ได้ติดตั้ง ให้เปิด Google Sheet → เมนู <b>💰 แอปการเงิน → 1) ติดตั้ง</b> แล้วโหลดหน้านี้ใหม่</p></div>';
  }
})();
</script>
